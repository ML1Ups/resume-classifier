[project]
name = "resume-classifier"
version = "0.2.0"
description = "MLOps-сервис классификации резюме соискателей по профессиональным направлениям"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "mlflow-skinny==3.10.0",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",
    "numpy==2.2.6",
]
ml = [
    "mlflow==3.10.0",
    "matplotlib==3.10.8",
    "psycopg2-binary==2.9.11",
    "boto3>=1.40,<2",
]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["web", "ml", "dev"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "S",
    "ASYNC",
    "FAST",
    "SIM",
    "C4",
    "PT",
    "RET",
    "T20",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/generate_demo_data.py" = ["RUF001", "S311"]
"src/resume_classifier/ml/train.py" = ["T201"]
"src/resume_classifier/ml/registry.py" = ["T201"]
"scripts/integration_check.py" = ["T201", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov"

[tool.coverage.run]
source = ["resume_classifier"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == "__main__":']
