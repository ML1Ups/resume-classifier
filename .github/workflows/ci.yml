name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked --only-group dev

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github

      - name: Ruff format check
        run: uv run --no-sync ruff format --check --diff

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        run: uv run --no-sync coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build and check docker compose stack
        run: ./scripts/smoke.sh

  readme:
    name: README guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Allow README changes in main only from docs/* branches
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'docs/')
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qx README.md; then
            echo "::error::README.md in main can only be changed from docs/* branches, not from $GITHUB_HEAD_REF"
            exit 1
          fi
