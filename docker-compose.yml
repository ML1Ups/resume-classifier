name: resume-classifier

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-model-env: &model-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-resume-classifier-hw3}
  MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-resume-classifier}
  MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}

services:
  app:
    build: .
    image: resume-classifier:local
    environment:
      <<: *model-env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-resume_classifier}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      INFERENCE_MAX_CONCURRENCY: ${INFERENCE_MAX_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      train:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-resume_classifier}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    logging: *default-logging

  mlflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow-local-password}
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    logging: *default-logging

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: resume-classifier-mlflow:local
    volumes:
      - artifact-store:/mlartifacts
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:-mlflow-local-password}@mlflow-db:5432/mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  train:
    build:
      context: .
      args:
        WITH_ML: "1"
    image: resume-classifier-train:local
    volumes:
      - ./data:/input:ro
    environment:
      <<: *model-env
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    command: ["python", "-m", "resume_classifier.ml.train", "--data", "${TRAIN_DATA_PATH:-/input/cv_target.csv}", "--output", "/app/results"]
    healthcheck:
      disable: true
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

volumes:
  pgdata:
  mlflow-pgdata:
  artifact-store:
