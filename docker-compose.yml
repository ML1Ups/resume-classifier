name: resume-classifier

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    image: resume-classifier:local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      train:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging

  mlflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD is required}
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *default-logging

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.0-full
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=postgresql://mlflow:${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD is required}@mlflow-db:5432/mlflow
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:*
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    logging: *default-logging

  train:
    build:
      context: .
      args:
        UV_GROUPS: --group web --group ml
    image: resume-classifier-train:local
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/input:ro
    command: ["python", "-m", "resume_classifier.ml.train", "--data", "${TRAIN_DATA_PATH:-/input/cv_target.csv}"]
    healthcheck:
      disable: true
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging: *default-logging

volumes:
  pgdata:
  mlflow-pgdata:
  mlflow-artifacts:

networks:
  backend:
